name: cotton-clay

services:
  tracker:
    build:
      context: .
    image: cotton-clay-tracker:local
    container_name: cotton-clay-tracker
    restart: unless-stopped
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    expose:
      - "43123"
    # Host 43123 only. 80/443 belong to homeserver-caddy-1; 5432 belongs to homeserver-postgres-1.
    ports:
      - "43123:43123"
    init: true
    environment:
      NODE_ENV: production
      PORT: "43123"
      HOSTNAME: "0.0.0.0"
      TZ: ${TZ:-Australia/Sydney}
      CONSIGNMENT_DATA_DIR: /data
      CONSIGNMENT_BACKUP_DIR: /backups
      CONSIGNMENT_SEED: "0"
      CONSIGNMENT_DOCKER: "1"
      CONSIGNMENT_PUBLIC_URLS: ${CONSIGNMENT_PUBLIC_URLS:-}
      CONSIGNMENT_BONJOUR: ${CONSIGNMENT_BONJOUR:-}
      CONSIGNMENT_ACCESS_CODE: ${CONSIGNMENT_ACCESS_CODE:-}
    volumes:
      - type: bind
        source: ${CONSIGNMENT_HOST_DATA}
        target: /data
      - type: bind
        source: ${CONSIGNMENT_HOST_BACKUPS}
        target: /backups

  backup:
    image: cotton-clay-tracker:local
    profiles: ["backup"]
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    environment:
      TZ: ${TZ:-Australia/Sydney}
      CONSIGNMENT_DATA_DIR: /data
      CONSIGNMENT_BACKUP_DIR: /backups
      CONSIGNMENT_BACKUP_KEEP: "14"
    volumes:
      - type: bind
        source: ${CONSIGNMENT_HOST_DATA}
        target: /data
      - type: bind
        source: ${CONSIGNMENT_HOST_BACKUPS}
        target: /backups
    entrypoint: ["node", "scripts/backup-data.mjs"]

networks:
  default:
    name: cotton-clay
